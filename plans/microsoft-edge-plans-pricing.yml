specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Microsoft Edge
providerId: microsoft-edge
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - Browser
  - Chromium
  - Developer Tools
  - Edge
  - Extensions
  - Microsoft
  - Progressive Web Apps
  - Web Development
  - WebView
description: Microsoft Edge is a free, evergreen Chromium-based browser. The Edge Add-ons API, DevTools
  Protocol HTTP API, Extensions API, and Web Platform APIs are made available to developers at no charge;
  there is no consumption-based pricing or paid tier. Microsoft Edge for Business is included with Microsoft
  365 / Entra ID subscriptions and adds enterprise management, SSO, and policy capabilities billed via
  the underlying Microsoft 365 SKU.
sources:
  - https://www.microsoft.com/en-us/edge/business
  - https://learn.microsoft.com/en-us/microsoft-edge/extensions-chromium/publish/api/
  - https://learn.microsoft.com/en-us/microsoft-edge/devtools-protocol-chromium/
plans:
  - id: microsoft-edge-developer
    name: Edge Developer APIs
    type: freemium
    description: Free developer access to the Edge Add-ons publishing API, DevTools Protocol HTTP API,
      Extensions API, and Web Platform APIs. Requires a Microsoft Partner Center account for Add-ons publishing.
    entries:
      - label: Edge Add-ons publishing API
        name: addons_api
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Edge DevTools Protocol HTTP API
        name: devtools_protocol
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Edge Extensions / Web Platform APIs
        name: web_platform
        type: flat
        metric: request
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Free browser distribution
      - name: Public developer documentation
      - name: Add-ons store publishing
      - name: Chromium-compatible extensions
      - name: Remote DevTools debugging over HTTP
  - id: microsoft-edge-for-business
    name: Microsoft Edge for Business
    type: subscription
    description: Enterprise-managed Edge included with Microsoft 365 Business / Enterprise / Entra ID
      subscriptions. Adds work-profile separation, IT policy management, and integrated SSO. Pricing inherits
      the underlying M365 / Entra SKU.
    entries:
      - label: Bundled with Microsoft 365 / Entra ID
        name: bundled_subscription
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included with Microsoft 365 / Entra ID
        userMultiplied: true
    elements:
      - name: Work profile separation
      - name: Group Policy / Intune-based configuration
      - name: Microsoft Entra single sign-on
      - name: Enterprise mode / IE compatibility
      - name: Microsoft Defender SmartScreen
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
