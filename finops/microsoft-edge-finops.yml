description: 'FOCUS-aligned FinOps for Microsoft Edge: the browser and developer APIs are free, with enterprise
  management surfaced as a no-incremental-charge feature of Microsoft 365 and Entra ID subscriptions.
  Costs flow through the bundled Microsoft 365 SKU rather than per-call metering.'
sources:
  - https://www.microsoft.com/en-us/edge/business
  - https://learn.microsoft.com/en-us/microsoft-edge/
billingModel:
  pricingCategory: Bundled with Microsoft 365
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Adjustment
focusColumns:
  ServiceName: Microsoft Edge
  ServiceCategory: Developer Tools
  ProviderName: Microsoft
  PublisherName: Microsoft Corporation
  InvoiceIssuerName: Microsoft Corporation
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: edge_for_business_seats
    description: Active Edge for Business users counted via the parent Microsoft 365 / Entra ID seat licenses
    unit: seat
    aggregation: sum
    dimensions:
      - tenant
      - sku
  - name: addons_api_calls
    description: Calls to the Edge Add-ons publishing API (no charge; tracked for fair-use)
    unit: request
    aggregation: sum
    dimensions:
      - partner_center_account
principles:
  - name: Visibility
    description: Edge consumption is observable via Microsoft 365 admin center usage reports and Entra
      sign-in logs; there is no separate Edge billing meter.
  - name: Allocation
    description: Allocate Edge for Business usage to teams via the M365 / Entra group memberships that
      control license assignment.
  - name: Optimization
    description: There is no per-seat charge for Edge itself; optimization focuses on the bundled M365
      SKU and on reducing DevTools / extension complexity inside the enterprise.
  - name: Accountability
    description: IT owns Edge configuration via Intune / Group Policy; finance owns the underlying M365
      SKU.
maintainers:
