naftiko: 1.0.0-alpha2
info:
  label: Microsoft Edge Browser Development
  description: Unified workflow for Microsoft Edge browser development combining DevTools Protocol debugging with Add-ons
    extension lifecycle management. Used by extension developers, web developers, and QA engineers.
  tags:
  - Microsoft Edge
  - Browser Development
  - Extensions
  - Debugging
  - Automation
  created: '2026-04-18'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    EDGE_DEVTOOLS_HOST: EDGE_DEVTOOLS_HOST
    EDGE_ADDONS_API_TOKEN: EDGE_ADDONS_API_TOKEN
capability:
  consumes:
  - type: http
    namespace: edge-devtools-api
    baseUri: http://localhost:9222
    description: HTTP endpoints for the Microsoft Edge DevTools Protocol based on the Chromium DevTools Protocol.
    resources:
    - name: targets
      path: /json
      description: Debuggable browser target management
      operations:
      - name: listTargets
        method: GET
        path: /list
        description: Microsoft Edge List Debuggable Targets
        outputRawFormat: json
        outputParameters:
        - name: result
          type: array
          value: $.
      - name: createTarget
        method: PUT
        path: /new
        description: Microsoft Edge Create New Target
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: activateTarget
        method: POST
        path: /activate/{targetId}
        description: Microsoft Edge Activate Target
        inputParameters:
        - name: targetId
          type: string
          required: true
        outputRawFormat: text
        outputParameters:
        - name: result
          type: string
          value: $.
      - name: closeTarget
        method: POST
        path: /close/{targetId}
        description: Microsoft Edge Close Target
        inputParameters:
        - name: targetId
          type: string
          required: true
        outputRawFormat: text
        outputParameters:
        - name: result
          type: string
          value: $.
    - name: browser
      path: /json
      description: Browser information
      operations:
      - name: getBrowserVersion
        method: GET
        path: /version
        description: Microsoft Edge Get Browser Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getProtocolSchema
        method: GET
        path: /protocol
        description: Microsoft Edge Get Protocol Schema
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: edge-addons-api
    baseUri: https://api.addons.microsoftedge.microsoft.com
    description: REST API for managing Microsoft Edge browser extensions through the Partner Center.
    authentication:
      type: bearer
      token: '{{EDGE_ADDONS_ACCESS_TOKEN}}'
    resources:
    - name: products
      path: /v1/products
      description: Extension product management
      operations:
      - name: listProducts
        method: GET
        description: Microsoft Edge List Products
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getProduct
        method: GET
        path: /{productId}
        description: Microsoft Edge Get Product
        inputParameters:
        - name: productId
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: submissions
      path: /v1/products/{productId}/submissions
      description: Extension submission management
      operations:
      - name: createSubmission
        method: POST
        description: Microsoft Edge Create Submission
        inputParameters:
        - name: productId
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getSubmission
        method: GET
        path: /{submissionId}
        description: Microsoft Edge Get Submission Status
        inputParameters:
        - name: productId
          type: string
          required: true
        - name: submissionId
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: packages
      path: /v1/products/{productId}/submissions/draft/package
      description: Extension package upload
      operations:
      - name: uploadPackage
        method: POST
        description: Microsoft Edge Upload Package
        inputParameters:
        - name: productId
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: getPackageUploadStatus
        method: GET
        path: /operations/{operationId}
        description: Microsoft Edge Get Package Upload Status
        inputParameters:
        - name: productId
          type: string
          required: true
        - name: operationId
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: browser-development-api
    description: Unified REST API for Microsoft Edge browser development workflows.
    resources:
    - path: /v1/targets
      name: targets
      description: Debuggable browser targets
      operations:
      - method: GET
        name: list-targets
        description: List all debuggable targets
        call: devtools-api.list-targets
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/targets/new
      name: new-target
      description: Create new browser target
      operations:
      - method: PUT
        name: create-target
        description: Open a new browser tab
        call: devtools-api.create-target
        with:
          url: rest.url
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/version
      name: version
      description: Browser version
      operations:
      - method: GET
        name: get-browser-version
        description: Get browser version info
        call: devtools-api.get-browser-version
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/extensions
      name: extensions
      description: Extension products
      operations:
      - method: GET
        name: list-products
        description: List extension products
        call: addons-api.list-products
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/extensions/{productId}
      name: extension-detail
      description: Extension product detail
      operations:
      - method: GET
        name: get-product
        description: Get extension details
        call: addons-api.get-product
        with:
          productId: rest.productId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: browser-development-mcp
    transport: http
    description: MCP server for AI-assisted Microsoft Edge browser development.
    tools:
    - name: list-targets
      description: List all debuggable browser targets in Microsoft Edge
      hints:
        readOnly: true
        openWorld: true
      call: devtools-api.list-targets
      outputParameters:
      - type: object
        mapping: $.
    - name: create-target
      description: Open a new browser tab in Microsoft Edge
      hints:
        readOnly: false
      call: devtools-api.create-target
      outputParameters:
      - type: object
        mapping: $.
    - name: activate-target
      description: Bring a browser tab to the foreground
      hints:
        readOnly: false
      call: devtools-api.activate-target
      outputParameters:
      - type: object
        mapping: $.
    - name: close-target
      description: Close a browser tab
      hints:
        readOnly: false
        destructive: true
      call: devtools-api.close-target
      outputParameters:
      - type: object
        mapping: $.
    - name: get-browser-version
      description: Get Microsoft Edge browser version information
      hints:
        readOnly: true
        openWorld: true
      call: devtools-api.get-browser-version
      outputParameters:
      - type: object
        mapping: $.
    - name: get-protocol-schema
      description: Get the full DevTools Protocol schema definition
      hints:
        readOnly: true
        openWorld: true
      call: devtools-api.get-protocol-schema
      outputParameters:
      - type: object
        mapping: $.
    - name: list-extensions
      description: List all extension products in the Edge Add-ons store
      hints:
        readOnly: true
        openWorld: true
      call: addons-api.list-products
      outputParameters:
      - type: object
        mapping: $.
    - name: get-extension
      description: Get details of an extension product
      hints:
        readOnly: true
        openWorld: true
      call: addons-api.get-product
      outputParameters:
      - type: object
        mapping: $.
    - name: create-submission
      description: Submit an extension for review and publishing
      hints:
        readOnly: false
      call: addons-api.create-submission
      outputParameters:
      - type: object
        mapping: $.
    - name: get-submission-status
      description: Check the status of an extension submission
      hints:
        readOnly: true
        openWorld: true
      call: addons-api.get-submission
      outputParameters:
      - type: object
        mapping: $.
    - name: upload-package
      description: Upload a new extension package
      hints:
        readOnly: false
      call: addons-api.upload-package
      outputParameters:
      - type: object
        mapping: $.
    - name: get-upload-status
      description: Check the status of a package upload
      hints:
        readOnly: true
        openWorld: true
      call: addons-api.get-upload-status
      outputParameters:
      - type: object
        mapping: $.
