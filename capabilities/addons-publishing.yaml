naftiko: 1.0.0-alpha2
info:
  label: Microsoft Edge Add-ons API — Publishing
  description: 'Microsoft Edge Add-ons API — Publishing. 2 operations. Lead operation: Microsoft Edge Create Submission. Self-contained
    Naftiko capability covering one Microsoft Edge business surface.'
  tags:
  - Microsoft Edge
  - Publishing
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    MICROSOFT_EDGE_API_KEY: MICROSOFT_EDGE_API_KEY
capability:
  consumes:
  - type: http
    namespace: addons-publishing
    baseUri: https://api.addons.microsoftedge.microsoft.com
    description: Microsoft Edge Add-ons API — Publishing business capability. Self-contained, no shared references.
    resources:
    - name: v1-products-productId-submissions
      path: /v1/products/{productId}/submissions
      operations:
      - name: createsubmission
        method: POST
        description: Microsoft Edge Create Submission
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: productId
          in: path
          type: string
          description: Product identifier
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: v1-products-productId-submissions-submissionId
      path: /v1/products/{productId}/submissions/{submissionId}
      operations:
      - name: getsubmission
        method: GET
        description: Microsoft Edge Get Submission Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: productId
          in: path
          type: string
          description: Product identifier
          required: true
        - name: submissionId
          in: path
          type: string
          description: Submission identifier
          required: true
    authentication:
      type: bearer
      token: '{{env.MICROSOFT_EDGE_API_KEY}}'
  exposes:
  - type: rest
    namespace: addons-publishing-rest
    port: 8080
    description: REST adapter for Microsoft Edge Add-ons API — Publishing. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v1/products/{productid}/submissions
      name: v1-products-productid-submissions
      description: REST surface for v1-products-productId-submissions.
      operations:
      - method: POST
        name: createsubmission
        description: Microsoft Edge Create Submission
        call: addons-publishing.createsubmission
        with:
          productId: rest.productId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v1/products/{productid}/submissions/{submissionid}
      name: v1-products-productid-submissions-submissionid
      description: REST surface for v1-products-productId-submissions-submissionId.
      operations:
      - method: GET
        name: getsubmission
        description: Microsoft Edge Get Submission Status
        call: addons-publishing.getsubmission
        with:
          productId: rest.productId
          submissionId: rest.submissionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: addons-publishing-mcp
    port: 9090
    transport: http
    description: MCP adapter for Microsoft Edge Add-ons API — Publishing. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: microsoft-edge-create-submission
      description: Microsoft Edge Create Submission
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: addons-publishing.createsubmission
      with:
        productId: tools.productId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: microsoft-edge-get-submission-status
      description: Microsoft Edge Get Submission Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: addons-publishing.getsubmission
      with:
        productId: tools.productId
        submissionId: tools.submissionId
      outputParameters:
      - type: object
        mapping: $.
